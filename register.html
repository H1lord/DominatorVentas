<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Dominator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">

        <img src="img/logo.png" class="auth-logo">
        <h1>Crear cuenta</h1>

        <form id="registerForm">

    <input type="text" id="registerName" placeholder="Nombre completo">

    <input type="email" id="registerEmail" placeholder="Correo electrónico">

    <input type="password" id="registerPassword" placeholder="Contraseña">

    <p class="login-error" id="registerError"></p>

    <button type="submit">Registrarme</button>

</form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
