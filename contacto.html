<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Dominator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contacto.css">
</head>
<body>

    <!-- Banner -->
    <div class="banner">
        <a href="index.html">
            <img src="img/logo.png" class="logo">
        </a>

        <nav class="menu">
            <a href="productos.html">Productos</a>
            <a href="#">Ofertas</a>
            <a href="#" class="btn-whatsapp">Whatsapp</a>
        </nav>
    </div>

    <!-- Contacto -->
    <section class="contacto-page">

        <div class="contacto-box">

            <h1>Contáctanos</h1>
            <p class="subtexto">
                Déjanos tu consulta y te responderemos lo antes posible.
            </p>

            <form id="formContacto">

                <input type="text" name="Nombre" placeholder="Tu nombre" required>

                <input type="email" name="Email" placeholder="Tu correo electrónico" required>

                <input type="tel" name="Numero" placeholder="Tu número celular" required>

                <textarea name="Consulta" rows="6" placeholder="Escribe tu consulta..." required></textarea>

                <button type="submit">Enviar Mensaje</button>

            </form>

        </div>

    </section>

    <div class="popup-contacto" id="popupContacto">
    <div class="popup-box">
        <h2 id="popupTitulo"></h2>
        <p id="popupMensaje"></p>
        <button id="cerrarPopup">Aceptar</button>
    </div>
</div>

<script src="js/contacto.js"></script>

</body>
</html>
