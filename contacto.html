<!DOCTYPE html>
<html lang="es">

<body>

    <!-- Banner -->

        <a href="Dominator.html">

        <nav class="menu">

    <!-- Contacto -->
    <section class="contacto-page">

        <div class="contacto-box">

            <h1>Contáctanos</h1>
            <p class="subtexto">
                Déjanos tu consulta y te responderemos lo antes posible.
            </p>

            <form action="mailto:Huamanjesus703@gmail.com" method="post" enctype="text/plain">

                <input type="text" name="Nombre" placeholder="Tu nombre" required>

                <input type="email" name="Email" placeholder="Tu correo electrónico" required>

                <input type="tel" name="Numero" placeholder="Tu número celular" required>

                <textarea name="Consulta" rows="6" placeholder="Escribe tu consulta..." required></textarea>

                <button type="submit">Enviar Mensaje</button>

            </form>

        </div>

    </section>

</body>
